version: '3.3'
services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - ../pg_data:/var/lib/postgresql/data
  backend:
    build: ../backend/
    env_file: .env
    depends_on:
      - db
    command: >
      sh -c "
        ./wait-for-it.sh ${DB_HOST}:${DB_PORT} --timeout=120 --strict -- echo 'Postgres is ready' &&
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        python manage.py load_ingredients &&
        python manage.py load_users &&
        python manage.py load_recipes &&
        gunicorn --bind 0.0.0.0:8000 foodgram.wsgi
      " 
    volumes:
      - ../backend/collected_static:/app/collected_static
      - ../backend/media:/app/media
  frontend:
    container_name: foodgram-front
    build: ../frontend
    volumes:
      - ../frontend/:/app/result_build/
  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ../backend/collected_static/.:/usr/share/nginx/html/backend_static
      - ../backend/media:/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
    depends_on:
      - backend
      - frontend
      - db
